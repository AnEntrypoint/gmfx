


SPECIFICATION Spec
CONSTANTS
    Alphabet = {"a", "b", "s+20", "s+2d"}
    MaxQuery = 3
    MaxField = 2
    Kinds <- NameAndText
    MaxFuzzyChars <- SmallFuzzyLimit
INVARIANT
    TypeOK
    MatchIsDeclarative
    Narrowing
    KeepsSubstringMatches
    KeepsTokenMatches
    LongQueriesMatchAsTyped
    PunctuationMatchesAsTyped
    CaseInsensitive
